<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart XO x Three Men's Morris</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc; margin: 0; }
        
        h1 { margin-bottom: 5px; color: #38bdf8; font-size: 2.2rem; }
        #status { font-size: 1.1rem; margin-bottom: 20px; font-weight: 600; color: #94a3b8; height: 30px; text-align: center; }
        
        /* მთავარი კონტეინერი */
        .board-wrapper {
            position: relative;
            width: 360px;
            height: 360px;
            background-color: #1e293b;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. შემერთებელი ხაზები SVG-ით (უჯრების ცენტრებს შორის) */
        .connector-lines {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            height: 320px;
            stroke: #475569;
            stroke-width: 4;
            stroke-linecap: round;
            pointer-events: none;
            z-index: 1;
        }

        /* 2. დაშორებული უჯრების ბადე */
        .nodes-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 35px; /* უჯრების დაშორება */
            z-index: 2;
        }

        /* კლასიკური XO-ს სტილის ცალკეული უჯრები */
        .cell {
            background-color: #0f172a;
            border: 3px solid #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .cell:hover:empty {
            border-color: #38bdf8;
            background-color: #1e293b;
            transform: scale(1.05);
        }

        /* XO ფიგურები */
        .cell.x { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); border-color: #0284c7; }
        .cell.o { color: #f43f5e; text-shadow: 0 0 10px rgba(244, 63, 94, 0.4); border-color: #e11d48; }
        
        /* არჩეული უჯრა გადაადგილებისას */
        .cell.selected {
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            transform: scale(1.08);
            background-color: #1e293b;
        }

        .btn {
            margin-top: 25px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background-color: #0369a1; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h1>Smart XO</h1>
    <div id="status">თამაში იტვირთება...</div>

    <div class="board-wrapper">
        <!-- შემერთებელი ხაზები უჯრების ცენტრებს შორის -->
        <svg class="connector-lines" viewBox="0 0 320 320">
            <!-- ჰორიზონტალური -->
            <line x1="40" y1="40" x2="280" y2="40" />
            <line x1="40" y1="160" x2="280" y2="160" />
            <line x1="40" y1="280" x2="280" y2="280" />
            <!-- ვერტიკალური -->
            <line x1="40" y1="40" x2="40" y2="280" />
            <line x1="160" y1="40" x2="160" y2="280" />
            <line x1="280" y1="40" x2="280" y2="280" />
            <!-- დიაგონალები -->
            <line x1="40" y1="40" x2="280" y2="280" />
            <line x1="280" y1="40" x2="40" y2="280" />
        </svg>

        <!-- დაშორებული XO უჯრები -->
        <div class="nodes-container">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <button class="btn" onclick="resetGame()">ახალი თამაში</button>

<script>
    const HUMAN = 'X';
    const AI = 'O';
    let board = Array(9).fill(null);
    let turn = HUMAN;
    let selectedCell = null;
    let gameOver = false;

    const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8], // ჰორიზონტალური
        [0,3,6], [1,4,7], [2,5,8], // ვერტიკალური
        [0,4,8], [2,4,6]           // დიაგონალური
    ];

    // ხაზების გასწვრივ მეზობლობა
    const adjacency = {
        0: [1, 3, 4],
        1: [0, 2, 4],
        2: [1, 4, 5],
        3: [0, 4, 6],
        4: [0, 1, 2, 3, 5, 6, 7, 8],
        5: [2, 4, 8],
        6: [3, 4, 7],
        7: [6, 4, 8],
        8: [5, 4, 7]
    };

    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));

    function countPieces(b, player) {
        return b.filter(c => c === player).length;
    }

    function checkWin(b, player) {
        return winPatterns.some(pattern => pattern.every(idx => b[idx] === player));
    }

    function handleCellClick(e) {
        if (gameOver || turn !== HUMAN) return;

        const index = parseInt(e.target.dataset.index);
        const humanPieces = countPieces(board, HUMAN);

        // 1. განლაგების ფაზა
        if (humanPieces < 3) {
            if (board[index] === null) {
                makeMove(index, HUMAN);
                if (!checkEnd()) {
                    turn = AI;
                    statusEl.innerText = "AI ფიქრობს...";
                    setTimeout(aiMove, 400);
                }
            }
        } 
        // 2. გადაადგილების ფაზა
        else {
            if (selectedCell === null) {
                if (board[index] === HUMAN) {
                    selectedCell = index;
                    highlightSelected();
                    statusEl.innerText = "აირჩიე მეზობელი ცარიელი უჯრა ხაზის გასწვრივ";
                }
            } else {
                if (index === selectedCell) {
                    selectedCell = null;
                    highlightSelected();
                    statusEl.innerText = "შენი სვლაა (გადაადგილე ფიგურა)";
                } else if (board[index] === null && adjacency[selectedCell].includes(index)) {
                    movePiece(selectedCell, index, HUMAN);
                    selectedCell = null;
                    highlightSelected();
                    if (!checkEnd()) {
                        turn = AI;
                        statusEl.innerText = "AI ფიქრობს...";
                        setTimeout(aiMove, 400);
                    }
                } else if (board[index] === HUMAN) {
                    selectedCell = index;
                    highlightSelected();
                }
            }
        }
    }

    function makeMove(index, player) {
        board[index] = player;
        render();
    }

    function movePiece(from, to, player) {
        board[from] = null;
        board[to] = player;
        render();
    }

    function render() {
        cells.forEach((cell, i) => {
            cell.innerText = board[i] || '';
            cell.className = 'cell' + (board[i] ? ' ' + board[i].toLowerCase() : '');
        });
    }

    function highlightSelected() {
        cells.forEach((cell, i) => {
            if (i === selectedCell) cell.classList.add('selected');
            else cell.classList.remove('selected');
        });
    }

    function checkEnd() {
        if (checkWin(board, HUMAN)) {
            statusEl.innerText = "🎉 შენ გაიმარჯვე!";
            gameOver = true;
            return true;
        }
        if (checkWin(board, AI)) {
            statusEl.innerText = "🤖 AI-მ გაიმარჯვა!";
            gameOver = true;
            return true;
        }
        return false;
    }

    // --- AI LOGIC (Minimax) ---
    function aiMove() {
        const aiPieces = countPieces(board, AI);

        if (aiPieces < 3) {
            let bestScore = -Infinity;
            let bestMove = null;
            for (let i = 0; i < 9; i++) {
                if (board[i] === null) {
                    board[i] = AI;
                    let score = minimax(board, 0, false, -Infinity, Infinity);
                    board[i] = null;
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            makeMove(bestMove, AI);
        } else {
            let bestScore = -Infinity;
            let bestMove = null;
            
            for (let from = 0; from < 9; from++) {
                if (board[from] === AI) {
                    for (let to of adjacency[from]) {
                        if (board[to] === null) {
                            board[from] = null; board[to] = AI;
                            let score = minimax(board, 0, false, -Infinity, Infinity);
                            board[to] = null; board[from] = AI;
                            if (score > bestScore) {
                                bestScore = score;
                                bestMove = { from, to };
                            }
                        }
                    }
                }
            }
            if (bestMove) movePiece(bestMove.from, bestMove.to, AI);
        }

        if (!checkEnd()) {
            turn = HUMAN;
            const hPieces = countPieces(board, HUMAN);
            statusEl.innerText = hPieces < 3 ? "შენი სვლაა (დადე ფიგურა)" : "შენი სვლაა (გადაადგილე ხაზზე)";
        }
    }

    function minimax(b, depth, isMaximizing, alpha, beta) {
        if (checkWin(b, AI)) return 10 - depth;
        if (checkWin(b, HUMAN)) return depth - 10;
        if (depth >= 4) return 0;

        const aiCount = countPieces(b, AI);
        const humanCount = countPieces(b, HUMAN);

        if (isMaximizing) {
            let maxEval = -Infinity;
            if (aiCount < 3) {
                for (let i = 0; i < 9; i++) {
                    if (b[i] === null) {
                        b[i] = AI;
                        let evaluation = minimax(b, depth + 1, false, alpha, beta);
                        b[i] = null;
                        maxEval = Math.max(maxEval, evaluation);
                        alpha = Math.max(alpha, evaluation);
                        if (beta <= alpha) break;
                    }
                }
            } else {
                for (let from = 0; from < 9; from++) {
                    if (b[from] === AI) {
                        for (let to of adjacency[from]) {
                            if (b[to] === null) {
                                b[from] = null; b[to] = AI;
                                let evaluation = minimax(b, depth + 1, false, alpha, beta);
                                b[to] = null; b[from] = AI;
                                maxEval = Math.max(maxEval, evaluation);
                                alpha = Math.max(alpha, evaluation);
                                if (beta <= alpha) break;
                            }
                        }
                    }
                }
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            if (humanCount < 3) {
                for (let i = 0; i < 9; i++) {
                    if (b[i] === null) {
                        b[i] = HUMAN;
                        let evaluation = minimax(b, depth + 1, true, alpha, beta);
                        b[i] = null;
                        minEval = Math.min(minEval, evaluation);
                        beta = Math.min(beta, evaluation);
                        if (beta <= alpha) break;
                    }
                }
            } else {
                for (let from = 0; from < 9; from++) {
                    if (b[from] === HUMAN) {
                        for (let to of adjacency[from]) {
                            if (b[to] === null) {
                                b[from] = null; b[to] = HUMAN;
                                let evaluation = minimax(b, depth + 1, true, alpha, beta);
                                b[to] = null; b[from] = HUMAN;
                                minEval = Math.min(minEval, evaluation);
                                beta = Math.min(beta, evaluation);
                                if (beta <= alpha) break;
                            }
                        }
                    }
                }
            }
            return minEval;
        }
    }

    function resetGame() {
        board = Array(9).fill(null);
        selectedCell = null;
        gameOver = false;
        
        // 50/50 შანსი დაწყებისას
        turn = Math.random() < 0.5 ? HUMAN : AI;
        render();

        if (turn === HUMAN) {
            statusEl.innerText = "შენი სვლაა (X) — დადე ფიგურა";
        } else {
            statusEl.innerText = "AI იწყებს... ფიქრობს...";
            setTimeout(aiMove, 500);
        }
    }

    // თამაშის ინიციალიზაცია პირველივე ჩატვირთვისას
    resetGame();
</script>
</body>
</html>
