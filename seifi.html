<!DOCTYPE html>
<html lang="ka">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>რიცხვითი სეიფი 🔐</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            #164e63 0%,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020617,
            #0f172a 55%,
            #111827
        );

    color:#f8fafc;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{

    width:100%;

    max-width:620px;

    background:rgba(15,23,42,.92);

    border:1px solid rgba(148,163,184,.2);

    border-radius:26px;

    padding:28px 24px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55);

    backdrop-filter:blur(15px);

}


/* =========================================================
   HEADER
========================================================= */

.header{

    text-align:center;

    margin-bottom:20px;

}

.title{

    font-size:1.8rem;

    font-weight:800;

    margin-bottom:6px;

}

.subtitle{

    color:#94a3b8;

    font-size:.92rem;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin-bottom:16px;

}

.stat{

    background:#111c31;

    border:1px solid #26354d;

    border-radius:12px;

    padding:9px 5px;

    text-align:center;

}

.stat-label{

    color:#64748b;

    font-size:.65rem;

}

.stat-value{

    margin-top:3px;

    font-size:.92rem;

    font-weight:800;

}


/* =========================================================
   LEVEL
========================================================= */

.level-box{

    text-align:center;

    margin-bottom:17px;

}

.level{

    display:inline-block;

    padding:7px 16px;

    border-radius:20px;

    font-size:.85rem;

    font-weight:bold;

    background:
        rgba(56,189,248,.1);

    border:
        1px solid rgba(56,189,248,.3);

    color:#38bdf8;

}


/* =========================================================
   SAFE
========================================================= */

.safe-display{

    background:#020617;

    border:2px solid #334155;

    border-radius:18px;

    padding:22px 15px;

    margin-bottom:19px;

    box-shadow:
        inset 0 3px 15px rgba(0,0,0,.7);

}

.lock-icon{

    text-align:center;

    font-size:3rem;

    margin-bottom:17px;

    transition:.3s;

}

.code-inputs{

    display:flex;

    justify-content:center;

    gap:10px;

}

.code-input{

    width:60px;

    height:68px;

    border-radius:13px;

    border:2px solid #475569;

    background:#1e293b;

    color:#38bdf8;

    text-align:center;

    font-size:2rem;

    font-weight:bold;

    outline:none;

    transition:.2s;

}

.code-input:focus{

    border-color:#38bdf8;

    box-shadow:
        0 0 16px rgba(56,189,248,.35);

    transform:translateY(-2px);

}


/* =========================================================
   HINTS
========================================================= */

.hints-box{

    background:#0b1425;

    border:1px solid #26354d;

    border-left:4px solid #38bdf8;

    border-radius:0 14px 14px 0;

    padding:17px;

    margin-bottom:18px;

}

.hints-title{

    color:#38bdf8;

    font-weight:800;

    margin-bottom:13px;

}

.hints-list{

    list-style:none;

}

.hints-list li{

    color:#cbd5e1;

    font-size:.92rem;

    line-height:1.45;

    margin-bottom:10px;

    padding-left:23px;

    position:relative;

}

.hints-list li:last-child{

    margin-bottom:0;

}

.hints-list li::before{

    content:"🔹";

    position:absolute;

    left:0;

}


/* =========================================================
   BUTTONS
========================================================= */

.buttons{

    display:flex;

    gap:9px;

}

button{

    border:0;

    cursor:pointer;

    border-radius:12px;

    padding:15px;

    font-size:1rem;

    font-weight:800;

    transition:.2s;

}

button:hover{

    transform:translateY(-2px);

}

button:active{

    transform:translateY(1px);

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;

}

.btn-submit{

    flex:1;

    color:white;

    background:
        linear-gradient(
            135deg,
            #0284c7,
            #0369a1
        );

    box-shadow:
        0 5px 18px rgba(2,132,199,.25);

}

.btn-new{

    width:54px;

    color:#e2e8f0;

    background:#1e293b;

    border:1px solid #334155;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    min-height:27px;

    text-align:center;

    margin-top:14px;

    font-weight:800;

    line-height:1.4;

}

.message.success{

    color:#4ade80;

}

.message.error{

    color:#f87171;

}

.message.info{

    color:#38bdf8;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress{

    height:7px;

    background:#1e293b;

    border-radius:10px;

    overflow:hidden;

    margin-top:18px;

}

.progress-bar{

    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            #0ea5e9,
            #38bdf8
        );

    transition:.4s;

}


/* =========================================================
   ACHIEVEMENTS
========================================================= */

.achievement-box{

    margin-top:20px;

    padding:15px;

    background:#0b1425;

    border:1px solid #26354d;

    border-radius:15px;

}

.achievement-title{

    font-weight:800;

    color:#fbbf24;

    margin-bottom:12px;

}

.achievements{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:7px;

}

.achievement{

    text-align:center;

    padding:8px 3px;

    border-radius:10px;

    background:#111c31;

    border:1px solid #26354d;

    opacity:.35;

    filter:grayscale(1);

    transition:.3s;

}

.achievement.unlocked{

    opacity:1;

    filter:none;

    border-color:#80651b;

    background:
        rgba(251,191,36,.08);

}

.achievement-icon{

    font-size:22px;

}

.achievement-name{

    font-size:9px;

    color:#94a3b8;

    margin-top:4px;

}


/* =========================================================
   RESET
========================================================= */

.reset-area{

    text-align:center;

    margin-top:17px;

}

.reset-btn{

    background:transparent;

    color:#64748b;

    border:0;

    font-size:.75rem;

    padding:6px 10px;

}

.reset-btn:hover{

    color:#f87171;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    20%,60%{
        transform:translateX(-7px);
    }

    40%,80%{
        transform:translateX(7px);
    }

}

.shake{

    animation:shake .4s;

}


@keyframes unlock{

    0%{
        transform:scale(1);
    }

    50%{
        transform:
            scale(1.3)
            rotate(-5deg);
    }

    100%{
        transform:scale(1);
    }

}

.unlock{

    animation:unlock .6s;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    body{

        padding:10px;

        align-items:flex-start;

    }

    .container{

        margin-top:10px;

        padding:21px 14px;

        border-radius:20px;

    }

    .title{

        font-size:1.5rem;

    }

    .subtitle{

        font-size:.82rem;

    }

    .topbar{

        grid-template-columns:
            repeat(2,1fr);

    }

    .code-input{

        width:53px;

        height:61px;

        font-size:1.8rem;

    }

    .code-inputs{

        gap:7px;

    }

    .hints-list li{

        font-size:.86rem;

    }

    .achievements{

        grid-template-columns:
            repeat(5,1fr);

    }

    .achievement-icon{

        font-size:18px;

    }

    .achievement-name{

        font-size:7px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="title">
            🔐 რიცხვითი სეიფი
        </div>

        <div class="subtitle">
            იპოვე 4-ციფრიანი კოდი ლოგიკური მინიშნებებით
        </div>

    </div>


    <!-- =====================================================
         STATS
    ====================================================== -->

    <div class="topbar">


        <div class="stat">

            <div class="stat-label">
                დონე
            </div>

            <div
                class="stat-value"
                id="levelValue"
            >
                1 / 20
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                ქულა
            </div>

            <div
                class="stat-value"
                id="scoreValue"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                შეცდომა
            </div>

            <div
                class="stat-value"
                id="mistakeValue"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                რეკორდი
            </div>

            <div
                class="stat-value"
                id="recordValue"
            >
                1 / 20
            </div>

        </div>


    </div>


    <!-- =====================================================
         DIFFICULTY
    ====================================================== -->

    <div class="level-box">

        <span
            class="level"
            id="difficulty"
        >
            🟢 მარტივი
        </span>

    </div>


    <!-- =====================================================
         SAFE
    ====================================================== -->

    <div
        class="safe-display"
        id="safeDisplay"
    >


        <div
            class="lock-icon"
            id="lockIcon"
        >
            🔒
        </div>


        <div class="code-inputs">


            <input
                class="code-input"
                id="digit1"
                maxlength="1"
                inputmode="numeric"

                autofocus
            >


            <input
                class="code-input"
                id="digit2"

                autocomplete="off"
            >


            <input
                class="code-input"
                id="digit3"
                maxlength="1"
                inputmode="numeric"
                autocomplete="off"
            >


            <input
                class="code-input"
                id="digit4"
                maxlength="1"
                inputmode="numeric"

            >


        </div>

    <!-- =====================================================
         HINTS

    <div class="hints-box">

    <!-- =====================================================
         MESSAGE
    ====================================================== -->

    <div
        class="message"

    <!-- =====================================================

    <div class="progress">

        <div

    <!-- =====================================================

    ====================================================== -->

    <div class="achievement-box">


        <div class="achievement-title">
            🏆 მიღწევები
        </div>


        <div class="achievements">


            <div
                class="achievement"
                id="achievement1"
            >

                <div class="achievement-icon">
                    🥉
                </div>

                <div class="achievement-name">
                    პირველი

            </div>


            <div
                class="achievement"
                id="achievement2"
            >

                <div class="achievement-icon">
                    🥈
                </div>

                <div class="achievement-name">
                    5 დონე
                </div>

            </div>


            <div
                class="achievement"
                id="achievement3"
            >

                <div class="achievement-icon">
                    🥇
                </div>

                <div class="achievement-name">
                    10 დონე
                </div>

            </div>


            <div
                class="achievement"
                id="achievement4"
            >

                <div class="achievement-icon">
                    💎
                </div>

                <div class="achievement-name">
                    15 დონე
                </div>

            </div>


            <div
                class="achievement"
                id="achievement5"
            >

                <div class="achievement-icon">
                    👑

                <div class="achievement-name">
                    20 დონე

        </button>

<script>

/* ============================================================
   STORAGE
============================================================ */


/*
    ეს არის ამ თამაშის უნიკალური გასაღები.

    ბრაუზერში შეინახება:

    number_safe_progress_v2

    სხვა თამაშებს არ შეეხება.
*/

const SAVE_KEY =
    "number_safe_progress_v2";


/* ============================================================
   GAME VARIABLES
============================================================ */

let currentLevel = 1;

let score = 0;

let totalMistakes = 0;

let levelAttempts = 0;

let solved = false;

let secretCode = [];

let puzzleConditions = [];

let puzzleHints = [];


/*
    მაქსიმალური დონე,
    რომელიც ერთხელ მაინც გაიარა.
*/

let maxLevelReached = 1;


/*
    სულ გავლილი დონეები.
*/

let completedLevels = 0;


/*
    ზედიზედ სწორი პასუხები.
*/

let streak = 0;


/* ============================================================
   ELEMENTS
============================================================ */

const inputs =
    document.querySelectorAll(".code-input");

const hintsList =
    document.getElementById("hintsList");

const message =
    document.getElementById("message");

const lockIcon =
    document.getElementById("lockIcon");

const safeDisplay =
    document.getElementById("safeDisplay");

const levelValue =
    document.getElementById("levelValue");

const scoreValue =
    document.getElementById("scoreValue");

const mistakeValue =
    document.getElementById("mistakeValue");

const recordValue =
    document.getElementById("recordValue");

const difficulty =
    document.getElementById("difficulty");

const progressBar =
    document.getElementById("progressBar");


/* ============================================================
   SAVE PROGRESS
============================================================ */

function saveProgress(){

    const data = {

        currentLevel:
            currentLevel,

        score:
            score,

        totalMistakes:
            totalMistakes,

        maxLevelReached:
            maxLevelReached,

        completedLevels:
            completedLevels,

        streak:
            streak

    };


    localStorage.setItem(

        SAVE_KEY,

        JSON.stringify(data)

    );

}


/* ============================================================
   LOAD PROGRESS
============================================================ */

function loadProgress(){

    const saved =
        localStorage.getItem(SAVE_KEY);


    /*
        თუ არაფერი არის შენახული,
        ახალი თამაში იწყება.
    */

    if(!saved){

        return;

    }


    try{

        const data =
            JSON.parse(saved);


        currentLevel =
            Number(data.currentLevel) || 1;


        score =
            Number(data.score) || 0;


        totalMistakes =
            Number(data.totalMistakes) || 0;


        maxLevelReached =
            Number(data.maxLevelReached) || 1;


        completedLevels =
            Number(data.completedLevels) || 0;


        streak =
            Number(data.streak) || 0;


        /*
            დაცვა დაზიანებული მონაცემებისგან
        */

        currentLevel =
            Math.max(
                1,
                Math.min(
                    20,
                    currentLevel
                )
            );


        maxLevelReached =
            Math.max(
                1,
                Math.min(
                    20,
                    maxLevelReached
                )
            );


    }catch(error){

        console.log(
            "შენახული პროგრესის წაკითხვა ვერ მოხერხდა."
        );

    }

}


/* ============================================================
   ALL CODES
============================================================ */

function allCodes(){

    const result = [];


    /*
        პირველი ციფრი 1-9,
        რათა 4-ციფრიანი კოდი
        0-ით არ იწყებოდეს.
    */

    for(let a=1;a<=9;a++){

        for(let b=0;b<=9;b++){

            for(let c=0;c<=9;c++){

                for(let d=0;d<=9;d++){

                    result.push([
                        a,
                        b,
                        c,
                        d
                    ]);

                }

            }

        }

    }


    return result;

}


/* ============================================================
   RANDOM ITEM
============================================================ */

function randomItem(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


/* ============================================================
   LEVEL 1
============================================================ */

function generateLevel1(){

    const candidates =
        allCodes().filter(
            ([a,b,c,d]) =>

            a > 4 &&
            b === a - 2 &&
            c === 8 &&
            d === 9
        );


    const code =
        randomItem(candidates);


    return {

        code,

        conditions:[

            x => x[0] > 4,

            x => x[1] === x[0]-2,

            x => x[2] === 8,

            x => x[3] === 9

        ],

        hints:[

            "პირველი ციფრი 4-ზე მეტია.",

            "მეორე ციფრი პირველზე 2-ით ნაკლებია.",

            "მესამე ციფრი 8-ია.",

            "მეოთხე ციფრი 9-ია."

        ]

    };

}


/* ============================================================
   LEVEL 2
============================================================ */

function generateLevel2(){

    const candidates =
        allCodes().filter(
            ([a,b,c,d]) =>

            a > 3 &&
            b < a &&
            c === a+b &&
            d === 9 &&
            c <= 9
        );


    const code =
        randomItem(candidates);


    return {

        code,

        conditions:[

            x => x[0] > 3,

            x => x[1] < x[0],

            x => x[2] === x[0]+x[1],

            x => x[3] === 9

        ],

        hints:[

            "პირველი ციფრი 3-ზე მეტია.",

            "მეორე ციფრი პირველზე ნაკლებია.",

            "პირველი და მეორე ციფრების ჯამი მესამე ციფრია.",

            "ბოლო ციფრი 9-ია."

        ]

    };

}


/* ============================================================
   LEVEL 3
============================================================ */

function generateLevel3(){

    const candidates =
        allCodes().filter(
            ([a,b,c,d]) =>

            a%2===0 &&
            b===a/2 &&
            c===a+b &&
            d>c
        );


    const code =
        randomItem(candidates);


    return {

        code,

        conditions:[

            x => x[0]%2===0,

            x => x[1]===x[0]/2,

            x => x[2]===x[0]+x[1],

            x => x[3]>x[2]

        ],

        hints:[

            "პირველი ციფრი ლუწია.",

            "მეორე ციფრი პირველი ციფრის ნახევარია.",

            "პირველი ორი ციფრის ჯამი მესამე ციფრია.",

            "მეოთხე ციფრი მესამეზე მეტია."

        ]

    };

}


/* ============================================================
   LEVEL 4
============================================================ */

function generateLevel4(){

    const candidates =
        allCodes().filter(
            ([a,b,c,d]) =>

            a>b &&
            c===a-b &&
            d===a+c &&
            d<=9 &&
            (a+b+c+d)%2===0
        );


    const code =
        randomItem(candidates);


    return {

        code,

        conditions:[

            x => x[0]>x[1],

            x => x[2]===x[0]-x[1],

            x => x[3]===x[0]+x[2],

            x =>
                (
                    x[0]+
                    x[1]+
                    x[2]+
                    x[3]
                )%2===0

        ],

        hints:[

            "პირველი ციფრი მეორეზე დიდია.",

            "პირველსა და მეორეს შორის სხვაობა მესამე ციფრია.",

            "პირველი და მესამე ციფრების ჯამი მეოთხე ციფრია.",

            "ოთხივე ციფრის ჯამი ლუწია."

        ]

    };

}


/* ============================================================
   LEVEL 5
============================================================ */

function generateLevel5(){

    const candidates =
        allCodes().filter(
            ([a,b,c,d]) =>

            a+d===10 &&
            b===a-3 &&

/* ============================================================
   CREATE PUZZLE
============================================================ */

function createPuzzle(){

    const generator =
        generators[currentLevel];


    let puzzle = null;


    for(let i=0;i<100;i++){

        puzzle = generator();


        if(
            puzzle &&
            puzzle.code &&
            puzzle.code.length===4
        ){

            break;

        }

    }


    if(!puzzle){

        console.log(
            "Puzzle generation failed"
        );

        return;

    }


    secretCode =
        puzzle.code.slice();


    puzzleConditions =
        puzzle.conditions.slice();


    puzzleHints =
        puzzle.hints.slice();


    renderHints();

}


/* ============================================================
   RENDER HINTS
============================================================ */

function renderHints(){

    hintsList.innerHTML = "";


    puzzleHints.forEach(
        (hint,index)=>{


            const li =
                document.createElement("li");


            li.textContent =
                hint;


            hintsList.appendChild(li);


        }
    );

}


/* ============================================================
   VERIFY
============================================================ */

function verifyCode(code){

    return puzzleConditions.every(
        condition =>
            condition(code)
    );

}

        );

/* ============================================================
   NEW PUZZLE
============================================================ */

function newPuzzle(){

    solved = false;

    levelAttempts = 0;


    lockIcon.textContent =
        "🔒";


    lockIcon.classList.remove(
        "unlock"
    );


    message.textContent =
        "";


    message.className =
        "message";


    inputs.forEach(
        input=>{

            input.value = "";

            input.disabled = false;

            input.style.borderColor =
                "#475569";

        }
    );


    createPuzzle();


    updateUI();


    setTimeout(
        ()=>{
            inputs[0].focus();
        },
        50
    );

}


/* ============================================================
   CHECK CODE
============================================================ */

function checkCode(){

    if(solved){

        return;

    }


    const code = [];


    for(const input of inputs){


        if(input.value === ""){

            showMessage(
                "⚠️ გთხოვ, შეიყვანე ოთხივე ციფრი.",
                "error"
            );

            return;

        }


        code.push(
            Number(input.value)
        );

    }


    levelAttempts++;


    const correct =
        verifyCode(code);


    if(correct){

        solveLevel();

    }else{

        wrongAnswer();

    }

}

   SOLVE LEVEL
============================================================ */

function solveLevel(){

    solved = true;


    /*
        ზედიზედ სწორი
    */

    streak++;


    /*
        გავლილი დონე
    */

    completedLevels++;


    /*
        რეკორდის განახლება
    */

    if(currentLevel > maxLevelReached){

        maxLevelReached =
            currentLevel;

    }


    /*
        ქულები
    */

    let points = 100;


    /*
        უფრო რთული დონე =
        მეტი ქულა
    */

    points +=
        (currentLevel-1)*10;


    /*
        სწრაფი ამოხსნა =
        ბონუსი
    */

    if(levelAttempts === 1){

        points += 50;

    }else if(levelAttempts === 2){

        points += 25;

    }


    /*
        streak bonus
    */

    if(streak >= 3){

        points += 25;

    }


    score += points;


    /*
        ვიზუალური ეფექტი
    */

    lockIcon.textContent =
        "🔓";


    lockIcon.classList.add(
        "unlock"
    );


    inputs.forEach(
        input=>{

            input.style.borderColor =
                "#4ade80";

            input.disabled = true;

        }
    );


    /*
        პროგრესის შენახვა
    */

    saveProgress();


    updateAchievements();


    updateUI();


    /*
        ბოლო დონე
    */

    if(currentLevel === 20){

        showMessage(
            "🏆 საოცარია! ყველა 20 დონე გაიარე! საბოლოო ქულა: "+score,
            "success"
        );


        return;

    }


    showMessage(
        "🎉 სწორია! სეიფი გაიხსნა! +"+points+" ქულა",
        "success"
    );


    /*
        შემდეგ დონეზე გადასვლა
    */

    setTimeout(
        ()=>{

            currentLevel++;


            /*
                ახალი დონე შეინახოს
                მანამდე, სანამ ამოცანა
                შეიქმნება.
            */

            saveProgress();


            newPuzzle();


        },
        1500
    );

}


/* ============================================================
   WRONG ANSWER
============================================================ */

function wrongAnswer(){

    totalMistakes++;


    /*
        streak წყდება
    */

    streak = 0;


    saveProgress();


    updateUI();


    lockIcon.textContent =
        "🔒";


    lockIcon.classList.remove(
        "unlock"
    );


    inputs.forEach(
        input=>{

            input.style.borderColor =
                "#f87171";

        }
    );


    safeDisplay.classList.remove(
        "shake"
    );


    void safeDisplay.offsetWidth;


    safeDisplay.classList.add(
        "shake"
    );


    showMessage(
        "❌ არასწორია. გადაამოწმე ყველა მინიშნება.",
        "error"
    );


    setTimeout(
        ()=>{

            inputs.forEach(
                input=>{

                    input.style.borderColor =
                        "#475569";

                }
            );

        },
        1000
    );

}


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(text,type){

    message.textContent =
        text;

    message.className =
        "message "+type;

}


/* ============================================================
   DIFFICULTY
============================================================ */

function getDifficulty(){

    if(currentLevel <= 5){

        return "🟢 მარტივი";

    }


    if(currentLevel <= 10){

        return "🟡 საშუალო";

    }


    if(currentLevel <= 15){

        return "🟠 რთული";

    }


    return "🔴 ექსპერტი";

}


/* ============================================================
   UPDATE UI
============================================================ */

function updateUI(){

    levelValue.textContent =
        currentLevel+" / 20";


    scoreValue.textContent =
        score;


    mistakeValue.textContent =
        totalMistakes;


    recordValue.textContent =
        maxLevelReached+" / 20";


    difficulty.textContent =
        getDifficulty();


    /*
        პროგრესის ზოლი
    */

    let progress =
        ((currentLevel-1)/20)*100;


    if(currentLevel === 20 &&
       solved){

        progress = 100;

    }


    progressBar.style.width =
        progress+"%";


    updateAchievements();

}


/* ============================================================
   RESET PROGRESS
============================================================ */

function resetProgress(){

    const confirmReset =
        confirm(
            "ნამდვილად გინდა ყველა მიღწევის, ქულის და პროგრესის წაშლა?"
        );


    if(!confirmReset){

        return;

    }


    localStorage.removeItem(
        SAVE_KEY
    );


    currentLevel = 1;

    score = 0;

    totalMistakes = 0;

    levelAttempts = 0;

    maxLevelReached = 1;

    completedLevels = 0;

    streak = 0;


    /*
        მიღწევების ჩაკეტვა
    */

    document
        .querySelectorAll(".achievement")
        .forEach(
            element =>
                element.classList.remove(
                    "unlocked"
                )
        );


    newPuzzle();


    updateUI();


    showMessage(
        "🔄 პროგრესი განულდა.",
        "info"
    );

}


/* ============================================================
   INPUT HANDLING
============================================================ */

inputs.forEach(
    (input,index)=>{


        input.addEventListener(
            "input",
            function(){


                this.value =
                    this.value.replace(
                        /[^0-9]/g,
                        ""
                    );


                /*
                    მხოლოდ ერთი ციფრი
                */

                if(this.value.length > 1){

                    this.value =
                        this.value.slice(0,1);

                }


                /*
                    ავტომატურად შემდეგ ველზე
                */

                if(
                    this.value &&
                    index <
                    inputs.length-1
                ){

                    inputs[index+1].focus();

                }

            }
        );


        input.addEventListener(
            "keydown",
            function(e){


                /*
                    Backspace
                */

                if(
                    e.key === "Backspace" &&
                    this.value === "" &&
                    index > 0
                ){

                    inputs[index-1].focus();

                }


                /*
                    მარცხენა ისარი
                */

                if(
                    e.key === "ArrowLeft" &&
                    index > 0
                ){

                    inputs[index-1].focus();

                }


                /*
                    მარჯვენა ისარი
                */

                if(
                    e.key === "ArrowRight" &&
                    index <
                    inputs.length-1
                ){

                    inputs[index+1].focus();

                }


                /*
                    Enter
                */

                if(e.key === "Enter"){

                    checkCode();

                }

            }
        );


    }
);


/* ============================================================
   LOAD SAVED GAME
============================================================ */

loadProgress();


/*
    ახალი ამოცანა იქმნება,
    მაგრამ მიმდინარე დონე და
    ყველა სტატისტიკა უკვე
    აღდგენილია localStorage-დან.
*/

newPuzzle();


updateUI();

</script>
