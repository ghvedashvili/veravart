<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cram Game</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
            --border: #cbd5e1;
            --cell-bg: #f8fafc;
            --player-color: #2563eb;
            --ai-color: #ef4444;
            --hover-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .status {
            font-size: 0.875rem;
            color: var(--subtext);
            margin-bottom: 24px;
            height: 1.2em;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.75rem;
            color: var(--subtext);
            margin-bottom: 24px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .box.player { background-color: var(--player-color); }
        .box.ai { background-color: var(--ai-color); }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background-color: var(--border);
            padding: 6px;
            border-radius: 8px;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px auto;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .cell.filled-player {
            background-color: var(--player-color);
            cursor: default;
        }

        .cell.filled-ai {
            background-color: var(--ai-color);
            cursor: default;
        }

        .cell.preview-valid {
            background-color: #93c5fd;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 240px;
            margin: 0 auto;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-subtle {
            background: transparent;
            color: var(--subtext);
            border: none;
        }

        .btn-subtle:hover {
            color: var(--text);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CRAM</h1>
    <div class="status" id="status">თქვენი სვლაა (ჰორიზონტალური)</div>

    <div class="legend">
        <div class="legend-item"><div class="box player"></div> თქვენ (—)</div>
        <div class="legend-item"><div class="box ai"></div> AI (|)</div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button class="btn-subtle" onclick="resetGame()">თავიდან დაწყება</button>
    </div>
</div>

<script>
    const SIZE = 5;
    let grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
    let isPlayerTurn = true;
    let gameOver = false;

    function initGame() {
        grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
        isPlayerTurn = true;
        gameOver = false;
        document.getElementById('status').innerText = 'თქვენი სვლაა (ჰორიზონტალური)';
        render();
    }

    function render() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';

        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const cellEl = document.createElement('div');
                cellEl.className = 'cell';

                if (grid[r][c] === 1) cellEl.classList.add('filled-player');
                if (grid[r][c] === 2) cellEl.classList.add('filled-ai');

                cellEl.onmouseenter = () => handleHover(r, c, true);
                cellEl.onmouseleave = () => handleHover(r, c, false);
                cellEl.onclick = () => playerMove(r, c);

                boardEl.appendChild(cellEl);
            }
        }
    }

    function handleHover(r, c, isEnter) {
        if (!isPlayerTurn || gameOver) return;
        
        // მოთამაშე დებს ჰორიზონტალურად (r, c) და (r, c + 1)
        if (c + 1 < SIZE && grid[r][c] === 0 && grid[r][c + 1] === 0) {
            const index1 = r * SIZE + c;
            const index2 = r * SIZE + (c + 1);
            const cells = document.querySelectorAll('.cell');
            
            if (isEnter) {
                cells[index1].classList.add('preview-valid');
                cells[index2].classList.add('preview-valid');
            } else {
                cells[index1].classList.remove('preview-valid');
                cells[index2].classList.remove('preview-valid');
            }
        }
    }

    function getValidMoves(isHorizontal) {
        let moves = [];
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                if (isHorizontal) {
                    if (c + 1 < SIZE && grid[r][c] === 0 && grid[r][c + 1] === 0) {
                        moves.push([{r, c}, {r, c: c + 1}]);
                    }
                } else {
                    if (r + 1 < SIZE && grid[r][c] === 0 && grid[r + 1][c] === 0) {
                        moves.push([{r, c}, {r: r + 1, c}]);
                    }
                }
            }
        }
        return moves;
    }

    function playerMove(r, c) {
        if (!isPlayerTurn || gameOver) return;

        if (c + 1 < SIZE && grid[r][c] === 0 && grid[r][c + 1] === 0) {
            grid[r][c] = 1;
            grid[r][c + 1] = 1;

            render();

            if (getValidMoves(false).length === 0) {
                document.getElementById('status').innerText = 'მოიგეთ! AI-ს სვლის ადგილი აღარ აქვს';
                gameOver = true;
                return;
            }

            isPlayerTurn = false;
            document.getElementById('status').innerText = 'კომპიუტერის სვლა (ვერტიკალური)...';

            setTimeout(aiMove, 600);
        }
    }

    function aiMove() {
        if (gameOver) return;

        const moves = getValidMoves(false); // AI დებს მხოლოდ ვერტიკალურად

        if (moves.length === 0) {
            document.getElementById('status').innerText = 'მოიგეთ!';
            gameOver = true;
            return;
        }

        // ალფა-ბეტა სტრატეგია ან საუკეთესო სვლის შეფასება 1 სვლის სიღრმეზე
        let bestMove = null;
        let minPlayerResponses = Infinity;

        for (let move of moves) {
            // სიმულაცია
            grid[move[0].r][move[0].c] = 2;
            grid[move[1].r][move[1].c] = 2;

            let playerNextMoves = getValidMoves(true).length;

            // უკუდაბრუნება
            grid[move[0].r][move[0].c] = 0;
            grid[move[1].r][move[1].c] = 0;

            if (playerNextMoves < minPlayerResponses) {
                minPlayerResponses = playerNextMoves;
                bestMove = move;
            }
        }

        // თუ თანაბარი პოზიციებია, შემთხვევით ირჩევს ერთ-ერთს
        if (!bestMove) {
            bestMove = moves[Math.floor(Math.random() * moves.length)];
        }

        grid[bestMove[0].r][bestMove[0].c] = 2;
        grid[bestMove[1].r][bestMove[1].c] = 2;

        render();

        if (getValidMoves(true).length === 0) {
            document.getElementById('status').innerText = 'წააგეთ! სვლის ადგილი აღარ გაქვთ';
            gameOver = true;
            return;
        }

        isPlayerTurn = true;
        document.getElementById('status').innerText = 'თქვენი სვლაა (ჰორიზონტალური)';
    }

    function resetGame() {
        initGame();
    }

    initGame();
</script>

</body>
</html>
