<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cram Game</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
            --border: #cbd5e1;
            --cell-bg: #f8fafc;
            --player-color: #2563eb;
            --ai-color: #ef4444;
            --draw-color: #6b7280;
            --selected-color: #93c5fd;
            --confirm-btn: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .status {
            font-size: 0.875rem;
            color: var(--subtext);
            margin-bottom: 20px;
            height: 1.2em;
            font-weight: 500;
        }

        .status.draw {
            color: var(--draw-color);
            font-weight: 700;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.75rem;
            color: var(--subtext);
            margin-bottom: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .box.player { background-color: var(--player-color); }
        .box.ai { background-color: var(--ai-color); }
        .box.draw { background-color: var(--draw-color); }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background-color: var(--border);
            padding: 6px;
            border-radius: 8px;
            width: 300px;
            height: 300px;
            margin: 0 auto 20px auto;
            transition: background-color 0.3s ease;
        }

        .board.is-draw {
            background-color: var(--draw-color);
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .cell.filled-player {
            background-color: var(--player-color);
            cursor: default;
        }

        .cell.filled-ai {
            background-color: var(--ai-color);
            cursor: default;
        }

        .cell.filled-draw {
            background-color: #9ca3af;
            cursor: default;
        }

        .cell.selected {
            background-color: var(--selected-color);
            box-shadow: inset 0 0 0 2px var(--player-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 240px;
            margin: 0 auto;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
        }

        .btn-confirm {
            background-color: var(--confirm-btn);
            color: white;
            display: none;
        }

        .btn-confirm.visible {
            display: block;
        }

        .btn-subtle {
            background: transparent;
            color: var(--subtext);
        }

        .btn-subtle:hover {
            color: var(--text);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CRAM</h1>
    <div class="status" id="status">თამაში იწყება...</div>

    <div class="legend">
        <div class="legend-item"><div class="box player"></div> თქვენ (—)</div>
        <div class="legend-item"><div class="box ai"></div> AI (|)</div>
        <div class="legend-item"><div class="box draw"></div> ფრე (=)</div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button class="btn-confirm" id="confirmBtn" onclick="confirmMove()">სვლის დადასტურება</button>
        <button class="btn-subtle" onclick="resetGame()">თავიდან დაწყება</button>
    </div>
</div>

<script>
    const SIZE = 5;
    let grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
    let isPlayerTurn = true;
    let gameOver = false;
    let isDrawGame = false;
    let selectedPos = null;
    let playerMovesCount = 0;
    let aiMovesCount = 0;

    function initGame() {
        grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
        gameOver = false;
        isDrawGame = false;
        selectedPos = null;
        playerMovesCount = 0;
        aiMovesCount = 0;
        
        toggleConfirmButton(false);
        document.getElementById('status').classList.remove('draw');

        // შემთხვევითი დაწყება (50/50 შანსი)
        isPlayerTurn = Math.random() < 0.5;

        render();

        if (isPlayerTurn) {
            document.getElementById('status').innerText = 'თქვენ იწყებთ! (ჰორიზონტალური)';
        } else {
            document.getElementById('status').innerText = 'AI იწყებს! (ვერტიკალური)';
            setTimeout(aiMove, 600);
        }
    }

    function render() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        
        if (isDrawGame) {
            boardEl.classList.add('is-draw');
        } else {
            boardEl.classList.remove('is-draw');
        }

        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const cellEl = document.createElement('div');
                cellEl.className = 'cell';

                if (isDrawGame && grid[r][c] !== 0) {
                    cellEl.classList.add('filled-draw');
                } else {
                    if (grid[r][c] === 1) cellEl.classList.add('filled-player');
                    if (grid[r][c] === 2) cellEl.classList.add('filled-ai');
                }

                if (selectedPos && selectedPos.r === r && (selectedPos.c === c || selectedPos.c + 1 === c)) {
                    cellEl.classList.add('selected');
                }

                cellEl.onclick = () => handleCellClick(r, c);
                boardEl.appendChild(cellEl);
            }
        }
    }

    function handleCellClick(r, c) {
        if (!isPlayerTurn || gameOver) return;

        if (selectedPos && selectedPos.r === r && (selectedPos.c === c || selectedPos.c + 1 === c)) {
            confirmMove();
            return;
        }

        let validColumn = c;
        if (c + 1 >= SIZE || grid[r][c] !== 0 || grid[r][c + 1] !== 0) {
            if (c - 1 >= 0 && grid[r][c - 1] === 0 && grid[r][c] === 0) {
                validColumn = c - 1;
            } else {
                return;
            }
        }

        selectedPos = { r, c: validColumn };
        toggleConfirmButton(true);
        render();
    }

    function confirmMove() {
        if (!selectedPos || !isPlayerTurn || gameOver) return;

        const { r, c } = selectedPos;
        grid[r][c] = 1;
        grid[r][c + 1] = 1;

        playerMovesCount++;
        selectedPos = null;
        toggleConfirmButton(false);

        // შემოწმება: დარჩა თუ არა AI-ს ვალიდური სვლა
        if (getValidMoves(false).length === 0) {
            checkGameOver();
            return;
        }

        isPlayerTurn = false;
        document.getElementById('status').innerText = 'კომპიუტერის სვლა...';
        render();

        setTimeout(aiMove, 500);
    }

    function checkGameOver() {
        // თუ მოთამაშეებს თანაბარი რაოდენობის სვლა აქვთ გაკეთებული და სვლები ამოიწურა -> ფრე
        if (playerMovesCount === aiMovesCount) {
            isDrawGame = true;
            gameOver = true;
            const statusEl = document.getElementById('status');
            statusEl.innerText = 'თამაში დასრულდა ფრედ! (თანაბარი სვლები)';
            statusEl.classList.add('draw');
            render();
            return true;
        }

        // სხვა შემთხვევაში იგებს ის, ვისი ოპონენტიც ვეღარ აკეთებს სვლას
        gameOver = true;
        if (isPlayerTurn) {
            document.getElementById('status').innerText = 'მოიგეთ! AI-ს სვლის ადგილი აღარ აქვს';
        } else {
            document.getElementById('status').innerText = 'წააგეთ! სვლის ადგილი აღარ გაქვთ';
        }
        render();
        return true;
    }

    function toggleConfirmButton(show) {
        const btn = document.getElementById('confirmBtn');
        if (show) {
            btn.classList.add('visible');
        } else {
            btn.classList.remove('visible');
        }
    }

    function getValidMoves(isHorizontal) {
        let moves = [];
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                if (isHorizontal) {
                    if (c + 1 < SIZE && grid[r][c] === 0 && grid[r][c + 1] === 0) {
                        moves.push([{r, c}, {r, c: c + 1}]);
                    }
                } else {
                    if (r + 1 < SIZE && grid[r][c] === 0 && grid[r + 1][c] === 0) {
                        moves.push([{r, c}, {r: r + 1, c}]);
                    }
                }
            }
        }
        return moves;
    }

    function aiMove() {
        if (gameOver) return;

        const moves = getValidMoves(false);

        if (moves.length === 0) {
            checkGameOver();
            return;
        }

        let bestMove = null;
        let minPlayerResponses = Infinity;

        for (let move of moves) {
            grid[move[0].r][move[0].c] = 2;
            grid[move[1].r][move[1].c] = 2;

            let playerNextMoves = getValidMoves(true).length;

            grid[move[0].r][move[0].c] = 0;
            grid[move[1].r][move[1].c] = 0;

            if (playerNextMoves < minPlayerResponses) {
                minPlayerResponses = playerNextMoves;
                bestMove = move;
            }
        }

        if (!bestMove) {
            bestMove = moves[Math.floor(Math.random() * moves.length)];
        }

        grid[bestMove[0].r][bestMove[0].c] = 2;
        grid[bestMove[1].r][bestMove[1].c] = 2;
        aiMovesCount++;

        if (getValidMoves(true).length === 0) {
            checkGameOver();
            return;
        }

        isPlayerTurn = true;
        document.getElementById('status').innerText = 'თქვენი სვლაა (ჰორიზონტალური)';
        render();
    }

    function resetGame() {
        initGame();
    }

    initGame();
</script>

</body>
</html>
