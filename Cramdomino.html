<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cram Game</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
            --border: #cbd5e1;
            --cell-bg: #f8fafc;
            --player-color: #2563eb;
            --ai-color: #ef4444;
            --draw-color: #475569;
            --preview-valid: rgba(37, 99, 235, 0.4);
            --preview-invalid: rgba(239, 68, 68, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .status {
            font-size: 0.9rem;
            color: var(--subtext);
            margin-bottom: 8px;
            min-height: 1.4em;
            font-weight: 500;
        }

        .status.winner { color: var(--player-color); font-weight: 700; }
        .status.loser { color: var(--ai-color); font-weight: 700; }
        .status.draw { color: var(--draw-color); font-weight: 700; }

        .score {
            font-size: 0.85rem;
            color: var(--subtext);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.75rem;
            color: var(--subtext);
            margin-bottom: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .box.player { background-color: var(--player-color); }
        .box.ai { background-color: var(--ai-color); }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background-color: var(--border);
            padding: 6px;
            border-radius: 8px;
            width: 300px;
            height: 300px;
            margin: 0 auto 20px auto;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .cell.filled-player {
            background-color: var(--player-color);
            cursor: default;
        }

        .cell.filled-ai {
            background-color: var(--ai-color);
            cursor: default;
        }

        .cell.preview-valid {
            background-color: var(--preview-valid);
        }

        .cell.preview-invalid {
            background-color: var(--preview-invalid);
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 240px;
            margin: 0 auto;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            color: var(--subtext);
            border: 1px solid var(--border);
            transition: all 0.15s ease;
        }

        button:hover {
            color: var(--text);
            border-color: var(--text);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CRAM</h1>
    <div class="status" id="status">თამაში იწყება...</div>
    <div class="score" id="score">ანგარიში — თქვენ: 0 | AI: 0</div>

    <div class="legend">
        <div class="legend-item"><div class="box player"></div> თქვენ (—)</div>
        <div class="legend-item"><div class="box ai"></div> AI (|)</div>
    </div>

    <div class="board" id="board" onmouseleave="clearPreview()"></div>

    <div class="controls">
        <button onclick="resetGame()">თავიდან დაწყება</button>
    </div>
</div>

<script>
    const SIZE = 5;
    let grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
    let isPlayerTurn = true;
    let gameOver = false;
    let playerMovesCount = 0;
    let aiMovesCount = 0;

    function initGame() {
        grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
        gameOver = false;
        playerMovesCount = 0;
        aiMovesCount = 0;
        
        const statusEl = document.getElementById('status');
        statusEl.className = 'status';
        updateScore();

        isPlayerTurn = Math.random() < 0.5;
        render();

        if (isPlayerTurn) {
            statusEl.innerText = 'თქვენი სვლაა (ჰორიზონტალური)';
        } else {
            statusEl.innerText = 'AI იწყებს...';
            setTimeout(aiMove, 500);
        }
    }

    function updateScore() {
        document.getElementById('score').innerText = `ანგარიში — თქვენ: ${playerMovesCount} | AI: ${aiMovesCount}`;
    }

    function render() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';

        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const cellEl = document.createElement('div');
                cellEl.className = 'cell';
                cellEl.dataset.r = r;
                cellEl.dataset.c = c;

                if (grid[r][c] === 1) cellEl.classList.add('filled-player');
                if (grid[r][c] === 2) cellEl.classList.add('filled-ai');

                cellEl.onmouseenter = () => handleMouseEnter(r, c);
                cellEl.onclick = () => handleCellClick(r, c);
                boardEl.appendChild(cellEl);
            }
        }
    }

    function getTargetColumn(r, c) {
        if (c + 1 < SIZE && grid[r][c] === 0 && grid[r][c + 1] === 0) {
            return c;
        } else if (c - 1 >= 0 && grid[r][c] === 0 && grid[r][c - 1] === 0) {
            return c - 1;
        }
        return null;
    }

    function handleMouseEnter(r, c) {
        clearPreview();
        if (!isPlayerTurn || gameOver) return;

        const targetC = getTargetColumn(r, c);

        if (targetC !== null) {
            highlightCells(r, targetC, r, targetC + 1, 'preview-valid');
        } else {
            const cellEl = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            if (cellEl && grid[r][c] === 0) {
                cellEl.classList.add('preview-invalid');
            }
        }
    }

    function highlightCells(r1, c1, r2, c2, className) {
        const cell1 = document.querySelector(`.cell[data-r="${r1}"][data-c="${c1}"]`);
        const cell2 = document.querySelector(`.cell[data-r="${r2}"][data-c="${c2}"]`);
        if (cell1) cell1.classList.add(className);
        if (cell2) cell2.classList.add(className);
    }

    function clearPreview() {
        document.querySelectorAll('.cell').forEach(cell => {
            cell.classList.remove('preview-valid', 'preview-invalid');
        });
    }

    function handleCellClick(r, c) {
        if (!isPlayerTurn || gameOver) return;

        const targetC = getTargetColumn(r, c);
        if (targetC === null) return;

        clearPreview();

        grid[r][targetC] = 1;
        grid[r][targetC + 1] = 1;
        playerMovesCount++;
        updateScore();
        render();

        const playerHasMoves = getValidMoves(true).length > 0;
        const aiHasMoves = getValidMoves(false).length > 0;

        if (!playerHasMoves && !aiHasMoves) {
            endGame();
            return;
        }

        if (aiHasMoves) {
            isPlayerTurn = false;
            document.getElementById('status').innerText = 'კომპიუტერის სვლა...';
            setTimeout(aiMove, 400);
        } else {
            // AI-ს სვლა აღარ აქვს, მოთამაშე აგრძელებს
            document.getElementById('status').innerText = 'AI-ს სვლები ამოეწურა! გააგრძელეთ თქვენი სვლები';
        }
    }

    function getValidMoves(isHorizontal) {
        let moves = [];
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                if (isHorizontal) {
                    if (c + 1 < SIZE && grid[r][c] === 0 && grid[r][c + 1] === 0) {
                        moves.push([{r, c}, {r, c: c + 1}]);
                    }
                } else {
                    if (r + 1 < SIZE && grid[r][c] === 0 && grid[r + 1][c] === 0) {
                        moves.push([{r, c}, {r: r + 1, c}]);
                    }
                }
            }
        }
        return moves;
    }

    function aiMove() {
        if (gameOver) return;

        const moves = getValidMoves(false);

        if (moves.length === 0) {
            const playerHasMoves = getValidMoves(true).length > 0;
            if (!playerHasMoves) {
                endGame();
            } else {
                isPlayerTurn = true;
                document.getElementById('status').innerText = 'AI-ს სვლები ამოეწურა! გააგრძელეთ თქვენი სვლა';
            }
            return;
        }

        let bestMove = null;
        let minPlayerResponses = Infinity;

        for (let move of moves) {
            grid[move[0].r][move[0].c] = 2;
            grid[move[1].r][move[1].c] = 2;

            let playerNextMoves = getValidMoves(true).length;

            grid[move[0].r][move[0].c] = 0;
            grid[move[1].r][move[1].c] = 0;

            if (playerNextMoves < minPlayerResponses) {
                minPlayerResponses = playerNextMoves;
                bestMove = move;
            }
        }

        if (!bestMove) {
            bestMove = moves[Math.floor(Math.random() * moves.length)];
        }

        grid[bestMove[0].r][bestMove[0].c] = 2;
        grid[bestMove[1].r][bestMove[1].c] = 2;
        aiMovesCount++;
        updateScore();
        render();

        const playerHasMoves = getValidMoves(true).length > 0;
        const aiHasMoves = getValidMoves(false).length > 0;

        if (!playerHasMoves && !aiHasMoves) {
            endGame();
            return;
        }

        if (playerHasMoves) {
            isPlayerTurn = true;
            document.getElementById('status').innerText = 'თქვენი სვლაა (ჰორიზონტალური)';
        } else {
            // მოთამაშეს სვლა აღარ აქვს, AI აგრძელებს ავტომატურად
            document.getElementById('status').innerText = 'სვლები ამოგეწურათ! AI აგრძელებს...';
            setTimeout(aiMove, 500);
        }
    }

    function endGame() {
        gameOver = true;
        clearPreview();
        const statusEl = document.getElementById('status');
        
        if (playerMovesCount === aiMovesCount) {
            statusEl.innerText = `🤝 ფრე! (საბოლოო ანგარიში: ${playerMovesCount} - ${aiMovesCount})`;
            statusEl.classList.add('draw');
        } else if (playerMovesCount > aiMovesCount) {
            statusEl.innerText = `🎉 თქვენ მოიგეთ! (საბოლოო ანგარიში: ${playerMovesCount} - ${aiMovesCount})`;
            statusEl.classList.add('winner');
        } else {
            statusEl.innerText = `❌ წააგეთ! (საბოლოო ანგარიში: ${playerMovesCount} - ${aiMovesCount})`;
            statusEl.classList.add('loser');
        }
    }

    function resetGame() {
        initGame();
    }

    initGame();
</script>

</body>
</html>
