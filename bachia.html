<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ბაჭია და მგლები 🐰🐺</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #1b5e20;
    padding: 15px;
}

.game {
    width: 100%;
    max-width: 440px;
    text-align: center;
}

h1 {
    margin: 0 0 4px 0;
    font-size: 28px;
    color: #1b5e20;
}

.subtitle {
    color: #43a047;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
}

.role-selector {
    background: #ffffff;
    border: 2px solid #a5d6a7;
    border-radius: 20px;
    padding: 10px;
    margin-bottom: 12px;
    box-shadow: 0 6px 16px rgba(46, 125, 50, 0.1);
}

.role-title {
    font-size: 13px;
    font-weight: 700;
    color: #2e7d32;
    margin-bottom: 6px;
}

.role-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.role-btn {
    flex: 1;
    padding: 8px;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid #a5d6a7;
    background: #f1f8e9;
    color: #2e7d32;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
}

.role-btn.active {
    background: linear-gradient(135deg, #2e7d32 0%, #43a047 100%);
    color: white;
    border-color: #2e7d32;
    box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
}

.status-box {
    background: #ffffff;
    border: 2px solid #a5d6a7;
    border-radius: 20px;
    padding: 10px 14px;
    margin-bottom: 12px;
    box-shadow: 0 8px 20px rgba(46, 125, 50, 0.12);
}

.status {
    font-size: 16px;
    font-weight: 800;
    color: #2e7d32;
    min-height: 22px;
}

/* =========================
   GAME BOARD
========================= */

.board {
    position: relative;
    width: 380px;
    height: 500px;
    margin: 0 auto;

    background:
        radial-gradient(
            circle at 50% 30%,
            #ffffff 0%,
            #e8f5e9 100%
        );

    border: 6px solid #388e3c;
    border-radius: 32px;

    box-shadow:
        0 16px 32px rgba(27, 94, 32, 0.2);

    overflow: hidden;
}

svg {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.game-line {
    stroke: #4caf50;
    stroke-width: 5;
    stroke-linecap: round;
    opacity: 0.9;
}

/* =========================
   NODES
========================= */

.node {
    position: absolute;

    width: 56px;
    height: 56px;

    margin-left: -28px;
    margin-top: -28px;

    border-radius: 50%;

    background: #ffffff;
    border: 4px solid #2e7d32;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;

    cursor: pointer;

    z-index: 3;

    user-select: none;

    transition:
        transform 0.18s,
        background 0.18s,
        box-shadow 0.18s;
}

.node:hover {
    transform: scale(1.08);
}

.node.selected {
    background: #fff9c4;
    border-color: #fbc02d;
    transform: scale(1.18);

    box-shadow:
        0 0 0 5px rgba(251, 192, 45, 0.2);
}

.node.possible {
    background: #a5d6a7;
    border-color: #1b5e20;

    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0%, 100% {
        box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4);
    }

    50% {
        box-shadow: 0 0 0 10px rgba(76, 175, 80, 0);
    }
}

/* =========================
   RESTART
========================= */

.restart-btn {
    width: 380px;

    margin-top: 12px;
    padding: 12px;

    border: none;
    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #2e7d32 0%,
            #43a047 100%
        );

    color: white;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 6px 14px rgba(46, 125, 50, 0.25);

    transition: transform 0.15s;
}

.restart-btn:hover {
    transform: translateY(-2px);
}

.restart-btn:active {
    transform: translateY(0);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 430px) {

    body {
        padding: 8px;
    }

    h1 {
        font-size: 24px;
    }

    .board {
        width: min(380px, 94vw);
        height: min(500px, 124vw);
    }

    .restart-btn {
        width: min(380px, 94vw);
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🐰 ბაჭია და მგლები 🐺</h1>

    <div class="subtitle">
        ორიგინალური კლასიკური დაფა
    </div>

    <div class="role-selector">

        <div class="role-title">
            🎯 აირჩიე შენი პერსონაჟი:
        </div>

        <div class="role-buttons">

            <button
                class="role-btn active"
                id="btn-wolf"
                onclick="selectRole('W')">
                🐺 3 მგელი
            </button>

            <button
                class="role-btn"
                id="btn-hare"
                onclick="selectRole('H')">
                🐰 1 ბაჭია
            </button>

        </div>

    </div>

    <div class="status-box">
        <div class="status" id="status">
            თამაში იწყება...
        </div>
    </div>

    <div class="board" id="board">

        <svg id="lines"></svg>

    </div>

    <button
        class="restart-btn"
        onclick="newGame()">
        🔄 ხელახლა დაწყება
    </button>

</div>


<script>

/* =========================================================
   BOARD NODES
========================================================= */

const nodes = [

    { id: 0,  x: 190, y: 45 },

    { id: 1,  x: 90,  y: 135 },
    { id: 2,  x: 190, y: 135 },
    { id: 3,  x: 290, y: 135 },

    { id: 4,  x: 90,  y: 245 },
    { id: 5,  x: 190, y: 245 },
    { id: 6,  x: 290, y: 245 },

    { id: 7,  x: 90,  y: 355 },
    { id: 8,  x: 190, y: 355 },
    { id: 9,  x: 290, y: 355 },

    { id: 10, x: 190, y: 445 }

];


/* =========================================================
   CONNECTIONS

   აქ არის მთავარი შესწორება.

   ცენტრი არის node 5.

   მაგალითად:
   7 → 5
   9 → 5

   ახლა მგელს შეუძლია ქვემოდან ცენტრში გადასვლა.
========================================================= */

const adj = {

    0:  [1, 2, 3],

    1:  [0, 2, 4, 5],
    2:  [0, 1, 3, 5],
    3:  [0, 2, 5, 6],

    4:  [1, 5, 7],

    5:  [
        1,
        2,
        3,
        4,
        6,
        7,
        8,
        9
    ],

    6:  [3, 5, 9],

    7:  [4, 5, 8, 10],
    8:  [5, 7, 9, 10],
    9:  [5, 6, 8, 10],

    10: [7, 8, 9]

};


/* =========================================================
   GAME VARIABLES
========================================================= */

let userRole = 'W';

let wolves = [];

let hare = 0;

let currentTurn = 'USER';

let selectedWolf = null;

let gameOver = false;


/* =========================================================
   SELECT ROLE
========================================================= */

function selectRole(role) {

    userRole = role;

    document
        .getElementById('btn-wolf')
        .classList
        .toggle('active', role === 'W');

    document
        .getElementById('btn-hare')
        .classList
        .toggle('active', role === 'H');

    newGame();
}


/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

    gameOver = false;

    selectedWolf = null;


    /*
       თუ მომხმარებელი მგელია:

       მგლები იწყებენ ქვემოდან.
       ბაჭია იწყებს ზემოდან.
    */

    if (userRole === 'W') {

        wolves = [7, 9, 10];

        hare = 0;

        currentTurn = 'AI';

        document
            .getElementById("status")
            .textContent =
            "ბაჭია იწყებს... 🐰";

        drawLines();

        render();

        setTimeout(aiHareMove, 500);

    }


    /*
       თუ მომხმარებელი ბაჭიაა:

       ბაჭია იწყებს ქვემოდან.
       მგლები იწყებენ ზემოდან.
    */

    else {

        wolves = [0, 1, 3];

        hare = 10;

        currentTurn = 'USER';

        document
            .getElementById("status")
            .textContent =
            "შენი სვლაა! აირჩიე ბაჭია 🐰";

        drawLines();

        render();
    }
}


/* =========================================================
   DRAW BOARD LINES
========================================================= */

function drawLines() {

    const svg =
        document.getElementById("lines");

    svg.innerHTML = "";

    const drawn = new Set();


    for (const from in adj) {

        adj[from].forEach(to => {

            const key =
                Math.min(from, to)
                + "-"
                + Math.max(from, to);

            if (drawn.has(key)) {
                return;
            }

            drawn.add(key);


            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                nodes[from].x
            );

            line.setAttribute(
                "y1",
                nodes[from].y
            );

            line.setAttribute(
                "x2",
                nodes[to].x
            );

            line.setAttribute(
                "y2",
                nodes[to].y
            );


            line.classList.add("game-line");

            svg.appendChild(line);

        });
    }
}


/* =========================================================
   WOLF MOVES
========================================================= */

function getWolfMoves(fromNode) {

    return adj[fromNode].filter(to => {


        /*
           მომხმარებელი მგელია.

           მგლები მოძრაობენ ქვემოდან ზემოთ.

           ამიტომ უკან დაბრუნება არ შეიძლება.
        */

        if (
            userRole === 'W' &&
            nodes[to].y >
            nodes[fromNode].y + 10
        ) {

            return false;
        }


        /*
           მომხმარებელი ბაჭიაა.

           AI მგლები მოძრაობენ ზემოდან ქვემოთ.
        */

        if (
            userRole === 'H' &&
            nodes[to].y <
            nodes[fromNode].y - 10
        ) {

            return false;
        }


        /*
           დაკავებულ წერტილზე გადასვლა არ შეიძლება.
        */

        if (
            wolves.includes(to) ||
            hare === to
        ) {

            return false;
        }


        return true;

    });
}


/* =========================================================
   HARE MOVES
========================================================= */

function getHareMoves() {

    return adj[hare].filter(
        to => !wolves.includes(to)
    );
}


/* =========================================================
   RENDER BOARD
========================================================= */

function render() {

    const board =
        document.getElementById("board");


    /*
       ძველი კვანძების წაშლა.
    */

    board
        .querySelectorAll(".node")
        .forEach(n => n.remove());


    nodes.forEach(node => {

        const el =
            document.createElement("div");


        el.className = "node";


        el.style.left =
            node.x + "px";

        el.style.top =
            node.y + "px";


        /*
           მგელი
        */

        if (wolves.includes(node.id)) {

            el.textContent = "🐺";

        }


        /*
           ბაჭია
        */

        else if (hare === node.id) {

            el.textContent = "🐰";

        }


        /*
           არჩეული მგელი
        */

        if (
            selectedWolf === node.id
        ) {

            el.classList.add("selected");

        }


        /*
           შესაძლო მგლის სვლა
        */

        if (
            selectedWolf !== null &&
            currentTurn === 'USER' &&
            userRole === 'W' &&
            getWolfMoves(selectedWolf)
                .includes(node.id)
        ) {

            el.classList.add("possible");

        }


        /*
           შესაძლო ბაჭიის სვლა
        */

        if (
            userRole === 'H' &&
            currentTurn === 'USER' &&
            selectedWolf === hare &&
            getHareMoves().includes(node.id)
        ) {

            el.classList.add("possible");

        }


        /*
           დაჭერა
        */

        el.onclick = () =>
            clickNode(node.id);


        board.appendChild(el);

    });
}


/* =========================================================
   CLICK NODE
========================================================= */

function clickNode(id) {

    if (
        gameOver ||
        currentTurn !== 'USER'
    ) {

        return;
    }


    /* =====================================================
       USER PLAYS WOLVES
    ===================================================== */

    if (userRole === 'W') {


        /*
           მგლის არჩევა
        */

        if (wolves.includes(id)) {

            selectedWolf = id;

            render();

            return;
        }


        /*
           არჩეული მგლის გადაადგილება
        */

        if (
            selectedWolf !== null &&
            getWolfMoves(selectedWolf)
                .includes(id)
        ) {

            const idx =
                wolves.indexOf(selectedWolf);


            wolves[idx] = id;


            selectedWolf = null;


            /*
               გამარჯვების შემოწმება
            */

            if (checkWin()) {
                return;
            }


            /*
               ახლა ბაჭიას სვლაა
            */

            currentTurn = 'AI';

            document
                .getElementById("status")
                .textContent =
                "ბაჭია ფიქრობს... 🐰";


            render();


            setTimeout(
                aiHareMove,
                400
            );

        }

    }


    /* =====================================================
       USER PLAYS HARE
    ===================================================== */

    else {


        /*
           ბაჭიის არჩევა
        */

        if (id === hare) {

            selectedWolf = hare;

            render();

            return;
        }


        /*
           ბაჭიის გადაადგილება
        */

        if (
            getHareMoves()
                .includes(id)
        ) {

            hare = id;

            selectedWolf = null;


            if (checkWin()) {
                return;
            }


            currentTurn = 'AI';


            document
                .getElementById("status")
                .textContent =
                "მგლები ფიქრობენ... 🐺";


            render();


            setTimeout(
                aiWolfMove,
                400
            );

        }

    }
}


/* =========================================================
   AI HARE MOVE
========================================================= */

function aiHareMove() {

    if (gameOver) {
        return;
    }


    const moves =
        getHareMoves();


    /*
       ბაჭიას სვლა აღარ აქვს.
       მგლებმა მოიგეს.
    */

    if (moves.length === 0) {

        finish(
            "🎉 მგლებმა ბაჭია ალყაში მოაქციეს! მოიგე! 🐺"
        );

        return;
    }


    /*
       ბაჭია ცდილობს ქვემოთ წასვლას.
    */

    moves.sort(
        (a, b) =>
            nodes[b].y -
            nodes[a].y
    );


    hare = moves[0];


    if (checkWin()) {
        return;
    }


    currentTurn = 'USER';


    document
        .getElementById("status")
        .textContent =
        "შენი სვლაა! აირჩიე მგელი 🐺";


    render();
}


/* =========================================================
   AI WOLF MOVE
========================================================= */

function aiWolfMove() {

    if (gameOver) {
        return;
    }


    let possibleMoves = [];


    /*
       ყველა მგლის შესაძლო სვლების პოვნა
    */

    wolves.forEach(
        (wId, idx) => {

            getWolfMoves(wId)
                .forEach(to => {

                    possibleMoves.push({

                        idx: idx,

                        from: wId,

                        to: to

                    });

                });

        }
    );


    /*
       თუ არც ერთ მგელს სვლა აღარ აქვს,
       ბაჭია იგებს.
    */

    if (
        possibleMoves.length === 0
    ) {

        finish(
            "🐰 მგლებს სვლა აღარ აქვთ! ბაჭიამ მოიგო!"
        );

        return;
    }


    /*
       მგელი ცდილობს ბაჭიასთან მიახლოებას.
    */

    possibleMoves.sort(
        (a, b) => {

            const dA =
                Math.hypot(
                    nodes[a.to].x -
                    nodes[hare].x,

                    nodes[a.to].y -
                    nodes[hare].y
                );


            const dB =
                Math.hypot(
                    nodes[b.to].x -
                    nodes[hare].x,

                    nodes[b.to].y -
                    nodes[hare].y
                );


            return dA - dB;
        }
    );


    /*
       საუკეთესო სვლა
    */

    wolves[
        possibleMoves[0].idx
    ] =
        possibleMoves[0].to;


    if (checkWin()) {
        return;
    }


    currentTurn = 'USER';


    document
        .getElementById("status")
        .textContent =
        "შენი სვლაა! აირჩიე ბაჭია 🐰";


    render();
}


/* =========================================================
   CHECK WIN
========================================================= */

function checkWin() {


    /* =====================================================
       USER = WOLVES
    ===================================================== */

    if (userRole === 'W') {

        /*
           ყველაზე წინ მყოფი მგლის Y
        */

        const minWolfY =
            Math.min(
                ...wolves.map(
                    id => nodes[id].y
                )
            );


        /*
           თუ ბაჭიამ მგლებს გაუსწრო
        */

        if (
            nodes[hare].y >
            minWolfY
        ) {

            finish(
                "🐰 ბაჭიამ გაასწრო მგლებს! ბაჭიამ მოიგო!"
            );

            return true;
        }


        /*
           ბაჭია ვეღარ მოძრაობს
        */

        if (
            getHareMoves().length === 0
        ) {

            finish(
                "🎉 მგლებმა ბაჭია ალყაში მოაქციეს! მოიგე! 🐺"
            );

            return true;
        }

    }


    /* =====================================================
       USER = HARE
    ===================================================== */

    else {

        const minWolfY =
            Math.min(
                ...wolves.map(
                    id => nodes[id].y
                )
            );


        /*
           ბაჭიამ მგლებს ზემოდან გაასწრო
        */

        if (
            nodes[hare].y <
            minWolfY
        ) {

            finish(
                "🎉 ბაჭიამ სამივე მგელს გაასწრო და მოიგო! 🐰"
            );

            return true;
        }


        /*
           ბაჭია ვეღარ მოძრაობს
        */

        if (
            getHareMoves().length === 0
        ) {

            finish(
                "🐺 მგლებმა ბაჭია ალყაში მოაქციეს! მგლებმა მოიგეს!"
            );

            return true;
        }

    }


    return false;
}


/* =========================================================
   FINISH GAME
========================================================= */

function finish(msg) {

    gameOver = true;

    document
        .getElementById("status")
        .textContent = msg;

    selectedWolf = null;

    render();
}


/* =========================================================
   START
========================================================= */

newGame();

</script>

</body>
</html>
